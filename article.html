<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulletins — NOLRO</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F4F0;color:#141C26;font-family:'IBM Plex Sans','Helvetica Neue',sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
header{background:#fff;border-bottom:1px solid #E3E1DA;padding:0 clamp(20px,5.5vw,80px);min-height:88px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header img{height:64px;display:block}
.back{font-weight:600;color:#8A5A00;transition:color .25s}.back:hover{color:#0E1B2C}
main{max-width:1100px;margin:0 auto;padding:clamp(40px,7vw,88px) clamp(20px,5.5vw,80px)}
h1,h2{font-family:'Source Serif 4',Georgia,serif;font-weight:500;line-height:1.15;margin:0}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#8A5A00;font-weight:600}
.art{max-width:760px;margin:0 auto}
.art h1{font-size:clamp(32px,5vw,52px);margin:12px 0 16px}
.lead{font-size:clamp(18px,2.2vw,22px);color:#4B5665;margin:0}
.art img{width:100%;height:auto;max-height:480px;object-fit:cover;display:block;margin:28px 0}
.art p.b{font-size:18px;white-space:pre-line;margin:0 0 20px}
.meta{font-size:14px;color:#5A6675;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;margin-top:32px}
.card{background:#fff;display:flex;flex-direction:column;transition:transform .35s,box-shadow .35s}
.card:hover{transform:translateY(-6px);box-shadow:0 22px 44px rgba(14,27,44,.14)}
.card img{width:100%;height:200px;object-fit:cover;display:block}
.card .t{padding:22px 24px;display:flex;flex-direction:column;gap:8px}
.card h2{font-size:22px}.card p{margin:0;color:#4B5665;font-size:15px}
.sub{display:inline-block;margin-top:36px;background:#0E1B2C;color:#fff;padding:14px 26px;font-weight:600;transition:background-color .25s,color .25s}
.sub:hover{background:#E0A93B;color:#0E1B2C}
footer{background:#08121F;color:#AEB9C7;padding:32px clamp(20px,5.5vw,80px);font-size:14px}
:focus-visible{outline:3px solid #E0A93B;outline-offset:2px}
</style>
</head>
<body>
<header><a href="index.html" aria-label="NOLRO home"><img src="logo.png" alt="NOLRO"></a><a class="back" href="index.html#news">&larr; Back to site</a></header>
<main id="main"><p>Loading…</p></main>
<footer>© Northwestern Ontario Labour Relations Organization</footer>
<script src="config.js"></script>
<script>
(function(){
  var C=window.NOLRO||{},U=C.SUPABASE_URL||'',K=C.SUPABASE_ANON_KEY||'',main=document.getElementById('main');
  var slug=new URLSearchParams(location.search).get('slug');
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function date(d){return new Date(d).toLocaleDateString('en-CA',{year:'numeric',month:'long',day:'numeric'})}
  function fail(t){main.innerHTML='';main.appendChild(el('p','',t))}
  if(!U||/YOUR-/.test(U))return fail('Bulletins are not available yet.');
  var q=slug?'slug=eq.'+encodeURIComponent(slug)+'&limit=1':'order=created_at.desc&limit=60';
  fetch(U+'/rest/v1/articles?select=*&published=eq.true&'+q,{headers:{apikey:K}})
   .then(function(r){if(!r.ok)throw 0;return r.json()})
   .then(function(rows){
     main.innerHTML='';
     if(slug){
       var a=rows[0];if(!a)return fail('That bulletin could not be found.');
       document.title=a.title+' — NOLRO';
       var w=el('article','art');
       w.appendChild(el('span','eyebrow',a.category));w.appendChild(el('h1','',a.title));
       w.appendChild(el('p','lead',a.summary));w.appendChild(el('p','meta',date(a.created_at)));
       if(a.image_url){var i=el('img');i.src=a.image_url;i.alt='';w.appendChild(i)}
       a.body.split(/\n{2,}/).forEach(function(p){w.appendChild(el('p','b',p.trim()))});
       var s=el('a','sub','Get bulletins by email');s.href='index.html#subscribe';w.appendChild(s);
       main.appendChild(w);
     }else{
       main.appendChild(el('span','eyebrow','Bulletins'));main.appendChild(el('h1','','Latest for contractors'));
       if(!rows.length)return main.appendChild(el('p','','No bulletins have been published yet.'));
       var g=el('div','grid');
       rows.forEach(function(a){
         var c=el('a','card');c.href='article.html?slug='+encodeURIComponent(a.slug);
         var i=el('img');i.src=a.image_url||'logo.png';i.alt='';if(!a.image_url)i.style.objectFit='contain';c.appendChild(i);
         var t=el('div','t');t.appendChild(el('span','eyebrow',a.category));t.appendChild(el('h2','',a.title));
         t.appendChild(el('p','',a.summary));t.appendChild(el('span','meta',date(a.created_at)));c.appendChild(t);g.appendChild(c);
       });
       main.appendChild(g);
     }
   }).catch(function(){fail('Could not load bulletins. Please try again later.')});
})();
</script>
</body>
</html>
